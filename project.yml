name: Pantrified
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1"
packages:
  Pantrified:
    path: .
targets:
  Pantrified:
    type: application
    platform: iOS
    sources:
      - path: App
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thisjustin816.Pantrified$(BUNDLE_ID_SUFFIX)
        PRODUCT_NAME: Pantrified
        INFOPLIST_KEY_CFBundleDisplayName: Pantrified
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: Pantrified
        product: PantrifiedDomain
      - package: Pantrified
        product: PantrifiedApplication
      - package: Pantrified
        product: PantrifiedFoundationModels
  PantrifiedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: Pantrified
schemes:
  Pantrified:
    build:
      targets:
        Pantrified: all
        PantrifiedTests: [test]
    test:
      targets:
        - PantrifiedTests
