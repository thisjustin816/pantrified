name: CI

# Host-level checks that run on Linux without Xcode. Apple SDK and simulator gates live in
# ios-build.yml.

on:
  # A change to docs alone can't break a build or a test, so it starts no run.
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every test target runs here, so a new one needs no change to this file.
  package-tests:
    name: Package tests
    runs-on: ubuntu-24.04
    container: swift:6.1.2-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run the package tests
        run: swift test

  repo-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Reject generated projects, signing material and private keys
        run: ./Scripts/verify-repo-hygiene.sh
      - name: Lint shell scripts
        run: shellcheck -x --severity=error Scripts/*.sh Scripts/tests/*.sh
      - name: Test the scripts
        run: |
          ./Scripts/tests/test_select_simulator.sh
          ./Scripts/tests/test_verify_repo_hygiene.sh
          ./Scripts/tests/test_verify_evaluation_gating.sh
      - name: Test the FoodKeeper converter and check the snapshot is current
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -I Scripts/tests/test_normalize_foodkeeper.py
          python3 -I Scripts/normalize-foodkeeper.py --check Data/FoodKeeper/foodkeeper.json Sources/PantrifiedGuidanceData/Resources/foodkeeper.normalized.json
      - name: Test the privacy checks and check the manifest against the code
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -I Scripts/tests/test_verify_privacy_manifest.py
          python3 -I Scripts/tests/test_verify_required_reason_apis.py
          python3 -I Scripts/verify-privacy-manifest.py App/PrivacyInfo.xcprivacy
          python3 -I Scripts/verify-required-reason-apis.py App/PrivacyInfo.xcprivacy App Sources
      - name: Test the app icon check and check the icon
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -I Scripts/tests/test_verify_app_icon.py
          python3 -I Scripts/verify-app-icon.py App/Assets.xcassets/AppIcon.appiconset
